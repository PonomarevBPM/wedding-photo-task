# Справочная копия конфигурации после очистки старых сайтов.
# Уже применена пользователем в /etc/nginx/sites-available/default.
# Деплой приложения этот файл не устанавливает и Nginx не перезагружает.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name wedding-dinner.ru www.wedding-dinner.ru;
    return 301 https://wedding-dinner.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wedding-dinner.ru www.wedding-dinner.ru;

    ssl_certificate /etc/letsencrypt/live/wedding-dinner.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wedding-dinner.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }
}
